<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How the Divvy data sources connect</title>
  <desc id="desc">Three public sources flow through a Python ETL pipeline into four SQLite tables. Trips and station snapshots connect to stations by station key. Trips connect to weather by trip date. The two GBFS feeds are matched by station ID.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, Arial, sans-serif; fill: #172554; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .card-title { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .table-title { font-size: 16px; font-weight: 700; fill: #172554; }
      .table-body { font-size: 13px; fill: #475569; }
      .join-title { font-size: 15px; font-weight: 700; fill: #172554; }
      .join-body { font-size: 13px; fill: #334155; }
    </style>
  </defs>
  <rect width="1200" height="820" rx="22" fill="#f8fafc"/>
  <text x="48" y="58" class="font title">How the three data sources connect</text>
  <text x="48" y="87" class="font subtitle">Public inputs are cleaned by Python, then stored in related SQLite tables.</text>

  <text x="55" y="132" class="font section">THREE SOURCES</text>
  <text x="432" y="132" class="font section">ETL STEPS</text>
  <text x="810" y="132" class="font section">SQLITE DATABASE</text>

  <g filter="url(#shadow)">
    <rect x="48" y="157" width="310" height="132" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="48" y="157" width="9" height="132" rx="4" fill="#2563eb"/>
    <circle cx="82" cy="190" r="14" fill="#dbeafe"/>
    <text x="82" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8" class="font">1</text>
    <text x="106" y="195" class="font card-title">Divvy trip history</text>
    <text x="76" y="228" class="font body">CSV archives: ride time and stations</text>
    <text x="76" y="256" class="font small">December 2019, January and February 2021</text>

    <rect x="48" y="323" width="310" height="150" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="48" y="323" width="9" height="150" rx="4" fill="#16a34a"/>
    <circle cx="82" cy="357" r="14" fill="#dcfce7"/>
    <text x="82" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d" class="font">2</text>
    <text x="106" y="362" class="font card-title">Divvy live stations</text>
    <text x="76" y="395" class="font body">GBFS station information + status</text>
    <text x="76" y="423" class="font small">Matched by station_id; snapshot saved as JSON</text>
    <text x="76" y="448" class="font small">Information gives names and capacity;</text>
    <text x="76" y="466" class="font small">status gives bikes and docks available.</text>

    <rect x="48" y="507" width="310" height="132" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <rect x="48" y="507" width="9" height="132" rx="4" fill="#d97706"/>
    <circle cx="82" cy="540" r="14" fill="#fef3c7"/>
    <text x="82" y="545" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309" class="font">3</text>
    <text x="106" y="545" class="font card-title">Open-Meteo weather</text>
    <text x="76" y="578" class="font body">Daily temperature and precipitation</text>
    <text x="76" y="606" class="font small">Chicago dates matching the trip months</text>
  </g>

  <path d="M358 223 C386 223 394 286 420 318" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M358 398 C386 398 395 398 420 398" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M358 573 C386 573 394 510 420 478" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="425" y="245" width="315" height="300" rx="18" fill="#1e3a8a"/>
    <text x="582" y="285" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" class="font">Python ETL</text>
    <text x="465" y="329" font-size="16" fill="#ffffff" class="font">1. Download and save raw data</text>
    <text x="465" y="371" font-size="16" fill="#ffffff" class="font">2. Standardize columns and dates</text>
    <text x="465" y="413" font-size="16" fill="#ffffff" class="font">3. Check and report bad records</text>
    <text x="465" y="455" font-size="16" fill="#ffffff" class="font">4. Load clean rows into SQLite</text>
    <rect x="465" y="486" width="235" height="34" rx="17" fill="#dbeafe"/>
    <text x="582" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" class="font">No API keys or packages</text>
  </g>

  <path d="M740 395 L790 395" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="800" y="151" width="350" height="526" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="824" y="173" width="302" height="70" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="844" y="201" class="font table-title">trips</text>
    <text x="844" y="224" class="font table-body">One row per ride; start and end station keys</text>

    <rect x="824" y="258" width="302" height="70" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="844" y="286" class="font table-title">stations</text>
    <text x="844" y="309" class="font table-body">One shared identity and metadata per station</text>

    <rect x="824" y="343" width="302" height="70" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="844" y="371" class="font table-title">station_snapshots</text>
    <text x="844" y="394" class="font table-body">Bikes and docks per station at capture time</text>

    <rect x="824" y="428" width="302" height="70" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="844" y="456" class="font table-title">daily_weather</text>
    <text x="844" y="479" class="font table-body">One temperature and rainfall record per day</text>

    <rect x="824" y="519" width="302" height="134" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="844" y="545" class="font join-title">How the tables connect</text>
    <text x="844" y="571" class="font join-body">Trip start/end station_key → stations</text>
    <text x="844" y="596" class="font join-body">Snapshot station_key → stations</text>
    <text x="844" y="621" class="font join-body">Trip start date → daily_weather.date</text>
    <text x="844" y="642" class="font small">Unknown station matches stay unknown.</text>
  </g>

  <text x="48" y="725" class="font section">ONE DATABASE, SEPARATE TABLES, THREE CLEAR CONNECTIONS</text>
  <text x="48" y="756" class="font subtitle">Trip endpoints link to stations. Trip dates link to weather. Live snapshots link to stations.</text>
</svg>


